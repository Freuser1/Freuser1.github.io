<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faraz Faramarzi - Projects</title>
    <link rel="stylesheet" href="stilar.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <header>
       
        <h1>Faraz Faramarzi</h1>
        <nav>
            <div class="home-icon">
                <a href="index.html">      
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                </a>
            </div>
            <ul>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Inquiry</a></li>
                <li><a href="kontakt.html">Kontakta</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div id="globe-container"></div>
        <div id="project-info" class="hidden">
            <!-- <h2 id="project-title"></h2>
            <img id="project-image" src="" alt="Project Image">
            <p id="project-description"></p>
            <button onclick="closeProject()">Back to Globe</button> -->
        </div>
        
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById("globe-container").appendChild(renderer.domElement);
    
            const textureLoader = new THREE.TextureLoader();
            const globeTexture = textureLoader.load("./textures/earth.png");
            const globeGeometry = new THREE.SphereGeometry(1, 64, 64);
            const globeMaterial = new THREE.MeshStandardMaterial({ 
                map: globeTexture,
                color: 0xffffff // Set the color to blue (you can change this to any color you like)
            });
            const globe = new THREE.Mesh(globeGeometry, globeMaterial);
            scene.add(globe);
    
            const light = new THREE.PointLight(0x00ff00, 1, 100);
            light.position.set(5, 5, 5);
            scene.add(light);
    
            camera.position.z = 3;
    
            const projects = [
                { position: { x: 0.5, y: 0.5, z: 1 }, title: "Project 1", image: "project1.jpg", description: "Description of project 1." },
                { position: { x: -0.5, y: -0.5, z: 1 }, title: "Project 2", image: "project2.jpg", description: "Description of project 2." },
                { position: { x: 0.7, y: -0.3, z: 1 }, title: "Project 3", image: "project3.jpg", description: "Description of project 3." },
                { position: { x: -0.2, y: 0.6, z: 1 }, title: "Project 4", image: "project4.jpg", description: "Description of project 4." }
            ];
            const ambientLight = new THREE.AmbientLight(0x404040, 2); // Mjuk bakgrundsbelysning
            scene.add(ambientLight);
    
            const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
            directionalLight.position.set(2, 2, 2);
            scene.add(directionalLight);
    
            projects.forEach(proj => {
                const markerGeometry = new THREE.SphereGeometry(0.02, 8, 8);
                const markerMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
                const marker = new THREE.Mesh(markerGeometry, markerMaterial);
                marker.position.set(proj.position.x, proj.position.y, proj.position.z);
                scene.add(marker);
                marker.userData = proj;
            });
    
            function animate() {
                requestAnimationFrame(animate);
                globe.rotation.y += 0.001;
                renderer.render(scene, camera);
            }
            animate();
    
            window.addEventListener("resize", function() {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
    
            renderer.domElement.addEventListener("click", function(event) {
                const raycaster = new THREE.Raycaster();
                const mouse = new THREE.Vector2();
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(scene.children);
                if (intersects.length > 0) {
                    const clickedObject = intersects[0].object;
                    if (clickedObject.userData.title) {
                        showProject(clickedObject.userData);
                    }
                }
            });
    
            function showProject(project) {
                document.getElementById("globe-container").style.display = "none";
                document.getElementById("project-info").classList.remove("hidden");
                document.getElementById("project-title").innerText = project.title;
                document.getElementById("project-image").src = project.image;
                document.getElementById("project-description").innerText = project.description;
            }
    
            window.closeProject = function() {
                document.getElementById("globe-container").style.display = "block";
                document.getElementById("project-info").classList.add("hidden");
            };
        });
    </script>
</body>
</html>
