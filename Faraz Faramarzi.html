<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faraz Faramarzi | Architecture Portfolio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Faraz Faramarzi</h1>
        <nav>
            <ul>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#contact">Inquiry</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section id="projects" class="grid-container">
            <!-- Sample Project -->
            <div class="project">
                <a href="project1.html">
                    <img src="bilder/Sol 25 mars 8 .png" alt="Project 1">
                    <h2>Project 1</h2>
                </a>
            </div>
            <div class="project">
                <a href="project2.html">
                    <img src="bilder/Skärmbild 2024-05-15 151432.png" alt="Project 2">
                    <h2>Project 2</h2>
                </a>
            </div>
        </section>
        
        <section id="contact" class="contact-form">
            <h2>Inquiry</h2>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
                
                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>
                
                <button type="submit">Send</button>
            </form>
        </section>
    </main>
    
    <footer>
        <p>&copy; 2025 Faraz Faramarzi</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
